[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specrunway"
version = "0.1.0"
description = "Central Store Coordinator local v1: specrunway CLI and Spec Kit specrunway step bridge"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
license = { text = "MIT" }

[project.scripts]
specrunway = "specrunway.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specrunway.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]
