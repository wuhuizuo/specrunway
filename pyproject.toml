[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-cli"
version = "0.1.0"
description = "Central Store Coordinator local v1: hub CLI and Spec Kit hub step bridge"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
license = { text = "MIT" }

[project.scripts]
hub = "hubcoord.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hubcoord.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]
