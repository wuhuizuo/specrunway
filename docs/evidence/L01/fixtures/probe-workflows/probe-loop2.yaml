schema_version: "1.0"
workflow:
  id: l01-probe-loop2
  name: L01 Control-Flow Probe
  version: "1.0.0"
inputs:
  execution: {type: string, required: true}
  store_uid: {type: string, default: ""}
  change_uid: {type: string, default: ""}
  plan_verdict: {type: string, default: ""}
  implementation_verdict: {type: string, default: ""}
steps:
  - id: prepare-note
    type: hub
    action: note
    label: prepare-note
    scratch: probe-loop2.ndjson
    execution: "{{ inputs.execution }}"
  - id: prepare
    type: hub
    action: prepare
    repos: [repo-a, repo-b]
    store_uid: "{{ inputs.store_uid }}"
    change_uid: "{{ inputs.change_uid }}"
    execution: "{{ inputs.execution }}"
    scratch: probe-loop2.ndjson
  - id: plan-review
    type: gate
    message: "Review the plan summary."
    options: [approve, reject]
    on_reject: abort
    verdict_input: plan_verdict
  - id: implement
    type: fan-out
    items: "{{ steps.prepare.output.data.repos }}"
    max_concurrency: 1
    scratch: probe-loop2.ndjson
    execution: "{{ inputs.execution }}"
    step:
      id: repo
      type: hub
      action: run-repo
      repo: "{{ item }}"
      task_ids: ["T001"]
      scratch: probe-loop2.ndjson
      execution: "{{ inputs.execution }}"
  - id: collect
    type: fan-in
    wait_for: [implement]
    output: {}
  - id: integration
    type: do-while
    condition: "{{ steps.verify-round.output.data.needs_repair }}"
    max_iterations: 3
    scratch: probe-loop2.ndjson
    repair_threshold: 2
    steps:
      - id: verify-round
        type: hub
        action: verify-round
        scratch: probe-loop2.ndjson
        repair_threshold: 2
  - id: require-green
    type: hub
    action: note
    label: require-green
    scratch: probe-loop2.ndjson
    execution: "{{ inputs.execution }}"
  - id: implementation-review
    type: gate
    message: "Review commits and verification evidence."
    options: [approve, reject]
    on_reject: abort
    verdict_input: implementation_verdict
  - id: ready
    type: hub
    action: note
    label: ready
    scratch: probe-loop2.ndjson
    execution: "{{ inputs.execution }}"
