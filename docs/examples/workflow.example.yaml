schema_version: "1.0"
workflow:
  id: hub-local-feature
  name: Local OpenSpec Feature
  version: "1.0.0"
inputs:
  execution: {type: string, required: true}
  plan_verdict: {type: string, default: ""}
  implementation_verdict: {type: string, default: ""}
steps:
  - id: prepare
    type: hub
    action: prepare
    execution: "{{ inputs.execution }}"
  - id: plan-review
    type: gate
    message: "Review the plan summary."
    options: [approve, reject]
    on_reject: abort
    verdict_input: plan_verdict
  - id: implement
    type: fan-out
    items: "{{ steps.prepare.output.data.repos }}"
    max_concurrency: 1
    step:
      id: repo
      type: hub
      action: run-repo
      execution: "{{ inputs.execution }}"
      repo: "{{ item }}"
  - id: collect
    type: fan-in
    wait_for: [implement]
    output: {}
  - id: integration
    type: do-while
    condition: "{{ steps.verify-round.output.data.needs_repair }}"
    max_iterations: 3
    steps:
      - id: verify-round
        type: hub
        action: verify-round
        execution: "{{ inputs.execution }}"
  - id: require-green
    type: hub
    action: assert-green
    execution: "{{ inputs.execution }}"
  - id: implementation-review
    type: gate
    message: "Review commits and verification evidence."
    options: [approve, reject]
    on_reject: abort
    verdict_input: implementation_verdict
  - id: ready
    type: hub
    action: record-ready
    execution: "{{ inputs.execution }}"
